name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install ruff

      - name: Lint
        run: ruff check d3ta1l3r tests

      - name: Test (offline; the suite uses httpx.MockTransport throughout)
        run: pytest -o addopts="" -q

      - name: Smoke-test the CLI in demo mode
        run: |
          d3ta1l3r --version
          d3ta1l3r sources --enabled-only | head -5
          d3ta1l3r scan -u ci_smoke -e ci.smoke@example.com --demo -o /tmp/d3ta1l3r-ci
          d3ta1l3r scan -u ci_smoke --demo -o /tmp/d3ta1l3r-ci --compare "$(ls /tmp/d3ta1l3r-ci/*.json | head -1)" || true
